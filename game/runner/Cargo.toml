[package]
name = "game-runner"
version = "0.1.0"
edition = "2024"

[features]
dynamic_linking = ["dep:engine-dylib", "game-logic/dynamic_linking"]
hot-reload = ["dep:hot-lib-reloader", "dynamic_linking"]
renderdoc = ["engine/renderdoc"]

[dependencies]
engine = { path = "../../engine" }
engine-dylib = { path = "../../engine_dylib", optional = true }
game-logic = { path = "../logic" }
game-types = { path = "../types" }
hot-lib-reloader = { workspace = true, optional = true }
winit = { workspace = true }
bytemuck = { workspace = true }
