[workspace]
members = [
    "engine",
    "editor/runner",
    "editor/logic",
    "game/logic",
    "game/types",
    "game/runner",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
# Graphics / windowing
wgpu = "29.0.0"
winit = { version = "0.30", features = ["android-native-activity"] }
egui = "0.34.2"
egui_dock = { version = "0.19.1", features = ["serde"] }
egui-wgpu = "0.34.2"
eframe = "0.34.2"
rfd = "0.15"
offset-allocator = "0.2"

# Math / utils
glam = { version = "0.32.0", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.24", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
rand = "0.8.5"
pollster = "0.3"

# Assets
tobj = { version = "4.0.3", default-features = false, features = ["async"] }
gltf = { version = "1.4.1" }

# Physics
rapier3d = { version = "0.29", features = ["simd-stable"] }

# Threading
rayon = "1.10"
crossbeam-channel = "0.5"
num_cpus = "1.17.0"
parking_lot = "0.12"
rustc-demangle = "0.1"


# Image
image = { version = "0.24", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
    "hdr",
] }

# Logging / errors
anyhow = "1.0"
log = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
tracy-client = { version = "0.18.4", default-features = false }
puffin = "0.20.0"
puffin_egui = { path = "third_party/puffin_egui" }

# Debugging
renderdoc = "0.12.1"
libloading = "0.8"

# Serialization
ron = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1"
uuid = { version = "1.23.0", features = ["serde", "v4", "js"] }
bevy_reflect = { version = "0.19.0", default-features = false, features = [
    "std",
    "glam",
    "uuid",
    "wgpu-types",
] }

# Hot reload
hot-lib-reloader = "0.8.2"
subsecond = "0.7.9"
dioxus-devtools = "0.7.9"

# Wasm
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3.69", features = [
    "Document",
    "Window",
    "Element",
    "Location",
] }
console_error_panic_hook = "0.1.6"
console_log = "1.0"
reqwest = "0.11"
getrandom = { version = "0.2.15", features = ["js"] }
web-time = "1.1"

[profile.dev]
codegen-units = 32
opt-level = 3

[profile.release]
strip = true
codegen-units = 1

# Optimized builds that retain PDB/source information for the automatic CPU
# profiler. Run with `cargo run --profile profiling ...`.
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = false
codegen-units = 16

[patch.crates-io]
hot-lib-reloader = { path = "third_party/hot-lib-reloader" }
