[target.x86_64-pc-windows-msvc]
# Dioxus hot-patching installs `dx` as a linker proxy. Do not force a custom
# linker here: dx 0.7.9 rewrites MSVC response files without preserving quotes,
# which breaks Visual Studio library paths containing spaces.
rustflags = ["-Zshare-generics=n"]

[alias]
build-game = "build -p game-runner"
xtask = "run --package xtask --quiet --"
play = "xtask play"
play-editor = "xtask play-editor"
play-renderdoc = "xtask play-renderdoc"
play-wasm = "xtask play-wasm"
